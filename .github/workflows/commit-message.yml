name: Commit Message

on:
  push:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: Validate commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message subjects
        shell: bash
        run: |
          set -euo pipefail

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([A-Za-z0-9._/-]+\))?!?: .+$'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.created }}" == "true" || "${{ github.event.before }}" =~ ^0+$ ]]; then
            range="${{ github.sha }}^..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          invalid=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"

            if [[ "$subject" == Merge\ * ]]; then
              continue
            fi

            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error title=Invalid commit message::${sha} ${subject}"
              invalid=1
            fi
          done < <(git log --format='%H %s' "$range")

          if [[ "$invalid" -ne 0 ]]; then
            echo "Commit message subjects must use: type: subject"
            echo "Allowed types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test"
            echo "Optional scopes and Unicode subjects are supported"
            exit 1
          fi
