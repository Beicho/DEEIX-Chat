name: deeix-chat
networks:
  deeix-chat:
    name: deeix-chat-network
services:
  app:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: https://chat.windhub.cc
      context: .
      dockerfile: Dockerfile
    container_name: deeix-chat-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgres://deeix_chat:deeix_chat_2026@postgres:5432/deeix_chat?sslmode=disable&TimeZone=Asia%2FShanghai
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: deeix_chat_2026
      REDIS_USERNAME: ''
      MEDIA_VIDEO_SOCKS5_PROXY: socks5h://172.17.0.1:40000
    image: ${DEEIX_CHAT_IMAGE:-ghcr.io/deeix-ai/deeix-chat:latest}
    networks:
    - deeix-chat
    ports:
    - 127.0.0.1:8080:8080
    volumes:
    - app_storage:/app/storage
    - app_data:/app/data
    - ./config.yaml:/app/config.yaml:ro
  postgres:
    container_name: deeix-chat-postgres
    environment:
      POSTGRES_DB: deeix_chat
      POSTGRES_PASSWORD: deeix_chat_2026
      POSTGRES_USER: deeix_chat
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 5s
    image: pgvector/pgvector:pg16
    networks:
    - deeix-chat
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
  redis:
    command: redis-server --requirepass deeix_chat_2026
    container_name: deeix-chat-redis
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
      - CMD
      - redis-cli
      - -a
      - deeix_chat_2026
      - ping
      timeout: 5s
    image: redis:7
    networks:
    - deeix-chat
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redis_data:/data
volumes:
  app_data:
    name: deeix-chat-app-data
  app_storage:
    name: deeix-chat-app-storage
  postgres_data:
    name: deeix-chat-postgres-data
  redis_data:
    name: deeix-chat-redis-data
